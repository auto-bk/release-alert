name: Alerta de Releases

# Roda a cada 5 min (minimo do GitHub; pode atrasar alguns min sob carga).
# Repo PUBLICO => minutos ilimitados, entao roda 24/7 de graca.
on:
  schedule:
    # Cron do GitHub e SEMPRE em UTC (Brasil = UTC-3). Regra em horario de Brasilia:
    #  - Seg a Sex, FORA do pregao (17h ate 10h do dia seguinte): a cada 5 min
    #    (resultados saem nas pontas: pos-fechamento, madrugada, pre-abertura)
    #  - Seg a Sex, DURANTE o pregao (10h-17h): 1x por hora (poucos releases)
    #  - Sabado e Domingo: 1x por dia, as 18h
    #  A sexta roda normal ate a meia-noite; a virada p/ sabado ja entra no fim de semana.
    - cron: "*/5 3-12,20-23 * * 1-5"   # 5min | Seg-Sex | UTC 3-12 e 20-23  = BRT 0h-9h e 17h-20h
    - cron: "*/5 0-2 * * 2-6"          # 5min | Ter-Sab | UTC 0h-2h = noites de Seg-Sex (BRT 21h-23h59)
    - cron: "0 13-19 * * 1-5"          # 1x/hora | Seg-Sex | UTC 13-19 = pregao BRT 10h-16h
    - cron: "0 21 * * 6,0"             # 1x | Sabado e Domingo | UTC 21h = BRT 18h
  workflow_dispatch:            # botao "Run workflow" p/ teste manual

permissions:
  contents: write              # p/ salvar o state.json entre as execucoes

# Nunca deixa duas execucoes ao mesmo tempo (evita conflito no state.json).
concurrency:
  group: alerta-releases
  cancel-in-progress: false

jobs:
  alerta:
    runs-on: ubuntu-latest
    env:
      TZ: America/Sao_Paulo
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencia (pypdf)
        run: pip install --quiet pypdf

      - name: Escrever config.json (a partir do secret)
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
        run: printf '%s' "$CONFIG_JSON" > config.json

      - name: Rodar o alerta de releases
        run: python release_alert.py

      - name: Mostrar o log (p/ depurar)
        if: always()
        run: tail -n 40 release_alert.log 2>/dev/null || true

      - name: Salvar estado (state.json) p/ a proxima execucao
        if: always()
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A                        # -A nao falha por arquivo faltando; .gitignore protege o config
          git commit -m "estado do alerta de releases" || echo "nada a salvar"
          git pull --rebase --autostash 2>/dev/null || true
          git push || echo "sem push"
